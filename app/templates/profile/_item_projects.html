{%- from "profile/_macros.html" import drag_handle, item_actions with context -%}
<li id="profile-projects-{{ item.id }}" class="group flex items-start justify-between gap-3 py-3">
  {{ drag_handle(section) }}
  <div class="flex min-w-0 flex-1 flex-col gap-0.5">
    <span class="text-sm font-semibold">{{ item.name }}</span>
    {%- if item.description %}<p class="m-0 whitespace-pre-line text-sm text-text-2">{{ item.description }}</p>{% endif %}
    {%- if item.url %}<span class="break-all text-xs text-text-3">{{ item.url }}</span>{% endif %}
  </div>
  {{ item_actions(section, item, item.name) }}
</li>
