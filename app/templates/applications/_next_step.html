{#- The Next step card (SPEC §6.13, D-073): one thing to do and when. "Change" and
    "Done" come in step 5 of plan M4b. Context: step, step_title, step_reason. -#}
<section id="next-step" aria-labelledby="next-step-title" class="flex flex-col gap-2 rounded-xl border border-border bg-surface p-5">
  <h2 id="next-step-title" class="m-0 text-sm font-bold">Next step</h2>
  <span class="text-base font-bold text-text">{{ step_title }}</span>
  <span class="text-xs text-text-3">{{ step_reason }}</span>
  {%- if step and step.automatic %}
    <span class="text-xs text-text-3">Set automatically from the status.</span>
  {%- endif %}
</section>
