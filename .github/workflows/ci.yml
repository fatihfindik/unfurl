# CI: lint + tests on every push; on pull requests to main also the Postgres tests
# (tests/test_postgres.py) and a Docker/Postgres smoke test.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# A new push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  lint-test:
    # Runs on every push. For pull requests only when they come from a fork:
    # a PR from a branch of this repo was already tested by its push, and that
    # result shows on the PR because it is the same commit.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Actions are pinned to a commit SHA (D-143): a tag can be moved, a SHA can't.
      # Dependabot updates the SHA and the version comment.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      # Pango for WeasyPrint: the CV PDF tests render real PDFs (D-051).
      - name: Install Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      # --locked: fail if uv.lock doesn't match pyproject.toml.
      # uv installs Python 3.12 from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  postgres-tests:
    # Only for pull requests to main: tests/test_postgres.py on a real PostgreSQL 16
    # (cascades, SELECT ... FOR UPDATE, races), which SQLite can't show.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same image as docker-compose.yml (the docker job checks it, D-143).
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unfurl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d unfurl_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@localhost:5432/unfurl_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: true

      # The app imports WeasyPrint, which needs Pango.
      - name: Install Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --locked

      # -rs lists skipped tests: if TEST_POSTGRES_URL were missing, all three would be
      # skipped, and the next step fails the job instead of passing silently.
      - name: Postgres tests
        run: uv run pytest tests/test_postgres.py -rs -p no:cacheprovider | tee pytest.log

      - name: Nothing was skipped
        run: "! grep -q skipped pytest.log"

  docker:
    # Only for pull requests to main: builds the image and runs it against Postgres.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot updates docker-compose.yml and the Dockerfile, not this file:
      # fail until ci.yml uses the same Postgres image and uv version (D-143).
      - name: Pinned versions match ci.yml
        run: |
          pg=$(grep -oE 'postgres:[^ ]+@sha256:[0-9a-f]+' docker-compose.yml)
          grep -qF "image: $pg" .github/workflows/ci.yml || { echo "ci.yml postgres image is not $pg"; exit 1; }
          uv=$(grep -oE 'astral-sh/uv:[0-9.]+' Dockerfile | cut -d: -f2)
          test "$(grep -cF "version: \"$uv\"" .github/workflows/ci.yml)" -eq 2 || { echo "ci.yml uv version is not $uv"; exit 1; }

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Start app + Postgres
        run: docker compose up -d --build --wait

      - name: Home page answers
        run: curl -fsS -o /dev/null http://localhost:8000/

      # The image has Pango and the fonts: a real CV PDF can be made inside it (D-051).
      - name: A CV PDF can be rendered in the image
        run: |
          docker compose exec -T app python -c "
          from app.models import CVDocument
          from app.schemas.cv import CVContent, CVPersonal
          from app.services.pdf_service import render_cv_pdf
          cv = CVDocument(user_id=1, title='t', language='de', content=CVContent(personal=CVPersonal(full_name='Jürgen Çelik')).to_json())
          pdf = render_cv_pdf(cv)
          assert pdf.startswith(b'%PDF'), 'not a PDF'
          print('PDF bytes:', len(pdf))
          "

      # Dates are shown in DEFAULT_TIMEZONE (D-071): the image must know the time zones.
      - name: Time zones work in the image
        run: |
          docker compose exec -T app python -c "
          from app.services import clock
          print('Today in', clock.tz().key, clock.today())
          "

      - name: Migrations ran on Postgres
        run: |
          version=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select version_num from alembic_version"')
          echo "alembic version: $version"
          test -n "$version"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
